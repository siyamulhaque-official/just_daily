<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Just Daily — Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f4ee;
      --paper-card: #ffffff;
      --ink: #111111;
      --ink-muted: #555555;
      --ink-border: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Hind Siliguri', 'Newsreader', serif;
      background-color: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 22px 18px 30px 18px;
      display: flex;
      flex-direction: column;
    }

    .content-area {
      flex: 1;
    }

    /* Top Action Bar */
    .top-nav {
      margin-bottom: 16px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      border: 1.5px solid var(--ink-border);
      background: var(--paper-card);
      padding: 5px 12px;
      border-radius: 6px;
      box-shadow: 1.5px 1.5px 0px var(--ink-border);
    }
    .back-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0px 0px 0px;
    }

    .source-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--ink-border);
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--ink);
      color: var(--paper);
      margin-bottom: 10px;
    }

    .headline {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink);
      margin-bottom: 16px;
    }

    /* E-Ink Newspaper Photo Frame (Grayscale + High Contrast) */
    .eink-image-box {
      width: 100%;
      border: 1.5px solid var(--ink-border);
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
      display: none; /* ছবি পাওয়া গেলে JS অন করবে */
    }
    .eink-image-box img {
      width: 100%;
      max-height: 230px;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(120%); /* সত্যিকারের খবরের কাগজের সাদাকালো ছবি */
    }

    /* Structured Summary (Book/Paper Reader Style) */
    .summary-card {
      background: var(--paper-card);
      border: 1.5px solid var(--ink-border);
      border-radius: 8px;
      padding: 18px 16px;
      box-shadow: 2px 2px 0px var(--ink-border);
      margin-bottom: 24px;
    }
    .summary-body {
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink);
    }
    .summary-body strong {
      display: block;
      color: var(--ink);
      font-size: 15.5px;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 4px;
      border-bottom: 1px dashed #bbb;
      padding-bottom: 2px;
    }
    .summary-body strong:first-child {
      margin-top: 0;
    }

    /* Solid Ink Action Button */
    .source-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      color: var(--paper);
      background: var(--ink);
      border: 1.5px solid var(--ink-border);
      border-radius: 6px;
      box-shadow: 2px 2px 0px var(--ink-border);
    }
    .source-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px;
    }

    .app-footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1.5px solid var(--ink-border);
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-muted);
    }
    .app-footer a {
      color: var(--ink);
      text-decoration: underline;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <main class="app-screen">
    <div class="content-area">
      <nav class="top-nav">
        <a href="index.html" class="back-btn">← ফিরে যান</a>
      </nav>

      <article id="article-view">
        <div>
          <span class="source-label" id="source-name">সংবাদপত্র</span>
        </div>
        <h1 class="headline" id="headline">শিরোনাম লোড হচ্ছে...</h1>

        <!-- E-Ink গ্রে-স্কেল ইমেজ ব্যানার -->
        <div class="eink-image-box" id="image-box">
          <img id="article-img" src="" alt="Photo">
        </div>

        <div class="summary-card">
          <div class="summary-body" id="summary-body">বিশ্লেষণ প্রস্তুত করা হচ্ছে...</div>
        </div>

        <a id="source-link" href="#" target="_blank" rel="noopener noreferrer" class="source-btn">
          মূল সংবাদপত্রে পড়ুন ↗
        </a>
      </article>
    </div>

    <footer class="app-footer">
      Developed by <a href="https://siyamulhaque.com" target="_blank" rel="noopener noreferrer">Siyamul Haque</a>
    </footer>
  </main>

  <script>
    function formatMarkdown(text) {
      if (!text) return '';
      let res = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      return res.replace(/\n/g, '<br>');
    }

    const params = new URLSearchParams(window.location.search);
    const articleId = parseInt(params.get('id'), 10);

    fetch('news.json?t=' + new Date().getTime(), { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        const item = data.articles[articleId];
        if (item) {
          document.getElementById('source-name').innerText = item.source;
          document.getElementById('headline').innerText = item.title;
          document.getElementById('summary-body').innerHTML = formatMarkdown(item.summary);
          document.getElementById('source-link').href = item.link;

          if (item.image) {
            const box = document.getElementById('image-box');
            const img = document.getElementById('article-img');
            img.src = item.image;
            box.style.display = 'block';
            img.onerror = () => { box.style.display = 'none'; };
          }
        } else {
          document.getElementById('article-view').innerHTML = '<p style="text-align:center;">সংবাদটি পাওয়া যায়নি।</p>';
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('summary-body').innerText = 'তথ্য লোড করতে সমস্যা হয়েছে।';
      });
  </script>

</body>
</html>
