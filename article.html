<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Just Daily — Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --palma-bg: #ece9e2;
      --palma-card: #f9f8f5;
      --ink-black: #0d0d0d;
      --ink-subtle: #4a4a4a;
      --ink-border: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    a, a:visited, a:hover, a:active {
      color: inherit !important;
      text-decoration: none !important;
    }

    body {
      font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--palma-bg);
      color: var(--ink-black);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 20px 16px 30px 16px;
      display: flex;
      flex-direction: column;
    }

    .content-area { flex: 1; }

    .top-nav { margin-bottom: 16px; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-black) !important;
      font-size: 13.5px;
      font-weight: 700;
      border: 1.5px solid var(--ink-border);
      background: var(--palma-card);
      padding: 5px 12px;
      border-radius: 6px;
      box-shadow: 1.5px 1.5px 0px var(--ink-border);
    }
    .back-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0px 0px 0px;
    }

    .source-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--ink-border);
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--ink-black);
      color: var(--palma-bg) !important;
      margin-bottom: 10px;
    }

    .headline {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink-black);
      margin-bottom: 16px;
    }

    /* Boox Palma 300 PPI E-Paper Photo Frame */
    .photo-frame {
      width: 100%;
      border: 1.5px solid var(--ink-border);
      background: #222;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 18px;
      display: none;
    }
    .photo-frame img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(118%);
    }

    /* Reader Document Card */
    .reader-card {
      background: var(--palma-card);
      border: 1.5px solid var(--ink-border);
      border-radius: 10px;
      padding: 18px 16px;
      box-shadow: 2px 2px 0px var(--ink-border);
      margin-bottom: 22px;
    }
    .summary-text {
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink-black);
    }
    .summary-text strong {
      display: block;
      color: var(--ink-black);
      font-size: 15.5px;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 4px;
      border-bottom: 1px dashed #b0ada6;
      padding-bottom: 2px;
    }
    .summary-text strong:first-child { margin-top: 0; }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--palma-bg) !important;
      background: var(--ink-black);
      border: 1.5px solid var(--ink-border);
      border-radius: 6px;
      box-shadow: 2px 2px 0px var(--ink-border);
    }
    .action-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0px 0px 0px;
    }

    .app-footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1.5px solid var(--ink-border);
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-subtle);
    }
    .app-footer a {
      color: var(--ink-black) !important;
      text-decoration: underline !important;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <main class="app-screen">
    <div class="content-area">
      <nav class="top-nav">
        <a href="index.html" class="back-btn">← ফিরে যান</a>
      </nav>

      <article id="article-root">
        <div>
          <span class="source-label" id="source-name">সংবাদ</span>
        </div>
        <h1 class="headline" id="headline">শিরোনাম লোড হচ্ছে...</h1>

        <div class="photo-frame" id="photo-frame">
          <img id="article-img" src="" alt="News Image">
        </div>

        <div class="reader-card">
          <div class="summary-text" id="summary-text">বিশ্লেষণ প্রস্তুত হচ্ছে...</div>
        </div>

        <a id="source-link" href="#" target="_blank" rel="noopener noreferrer" class="action-btn">
          মূল সংবাদপত্রে পড়ুন ↗
        </a>
      </article>
    </div>

    <footer class="app-footer">
      Developed by <a href="https://siyamulhaque.com" target="_blank" rel="noopener noreferrer">Siyamul Haque</a>
    </footer>
  </main>

  <script>
    function renderMarkdown(txt) {
      if (!txt) return '';
      let res = txt.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      return res.replace(/\n/g, '<br>');
    }

    const params = new URLSearchParams(window.location.search);
    const articleId = parseInt(params.get('id'), 10);

    fetch('news.json?t=' + new Date().getTime(), { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        const item = data.articles[articleId];
        if (item) {
          document.getElementById('source-name').innerText = item.source;
          document.getElementById('headline').innerText = item.title;
          document.getElementById('summary-text').innerHTML = renderMarkdown(item.summary);
          document.getElementById('source-link').href = item.link;

          if (item.image) {
            const frame = document.getElementById('photo-frame');
            const img = document.getElementById('article-img');
            img.src = item.image;
            frame.style.display = 'block';
            img.onerror = () => { frame.style.display = 'none'; };
          }
        } else {
          document.getElementById('article-root').innerHTML = '<p style="text-align:center;">সংবাদটি পাওয়া যায়নি।</p>';
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('summary-text').innerText = 'তথ্য লোড করতে সমস্যা হয়েছে।';
      });
  </script>

</body>
</html>
