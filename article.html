<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Just Daily</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #161618;
            --surface: #1c1c1f;
            --text-body: #a1a1aa;
            --text-heading: #e4e4e7;
            --border-color: #27272a;
            --highlight-bg: rgba(250, 204, 21, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-body);
            font-family: 'Merriweather', serif; 
            line-height: 1.8;
            font-size: 18px;
            /* Disable native popups where possible */
            -webkit-touch-callout: none;
        }

        .nav {
            padding: 20px;
            font-family: 'Inter', sans-serif;
            max-width: 700px;
            margin: 0 auto;
        }

        .nav a {
            color: var(--text-body);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .nav a:hover { color: var(--text-heading); }

        .article-container {
            max-width: 700px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }

        .hero-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            filter: brightness(0.9);
            margin-bottom: 15px;
            display: none;
        }

        .metadata-container {
            font-family: 'Inter', sans-serif;
            margin-bottom: 30px;
        }

        .source-caption {
            font-size: 0.85rem;
            color: var(--text-heading);
            font-weight: 600;
            display: block;
        }
        
        .date-caption {
            font-size: 0.85rem;
            color: #71717a;
            display: block;
            margin-top: 2px;
        }

        h1 {
            color: var(--text-heading);
            font-size: 2.2rem;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .content {
            margin-bottom: 50px;
            color: var(--text-body);
        }
        
        /* Preserve paragraph spacing */
        .content p {
            margin-bottom: 1.5em;
        }

        .summary-box {
            background-color: var(--surface);
            border-left: 4px solid #52525b;
            padding: 25px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 40px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        .summary-box h3 {
            margin-top: 0;
            color: var(--text-heading);
            font-size: 1.1rem;
        }

        .btn-original {
            display: inline-block;
            background-color: var(--text-heading);
            color: var(--bg-dark);
            padding: 12px 24px;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* Custom Selection Toolbar */
        .highlighted-text {
            background-color: var(--highlight-bg);
            border-radius: 2px;
        }

        #custom-toolbar {
            position: absolute;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: none;
            z-index: 1000;
            overflow: hidden;
            flex-direction: row;
        }

        #custom-toolbar button {
            background: none;
            color: #fff;
            border: none;
            border-right: 1px solid #3f3f46;
            padding: 10px 15px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }
        
        #custom-toolbar button:last-child {
            border-right: none;
        }
        
        #custom-toolbar button:hover {
            background: #3f3f46;
        }

        /* Bottom Sheet Translator UI */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--surface);
            border-top: 1px solid var(--border-color);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            font-family: 'Inter', sans-serif;
        }

        .bottom-sheet.active { transform: translateY(0); }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-heading);
            font-weight: 600;
        }

        .close-sheet {
            background: none;
            border: none;
            color: var(--text-body);
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .loader {
            color: #71717a;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="nav">
        <a href="index.html">← Back to Feed</a>
    </div>

    <div class="article-container">
        <img id="art-img" class="hero-img" src="" alt="Article Cover">
        
        <div class="metadata-container">
            <span id="art-source" class="source-caption"></span>
            <span id="art-date" class="date-caption"></span>
        </div>
        
        <h1 id="art-title">Loading...</h1>
        
        <div id="art-content" class="content"></div>
        
        <div class="summary-box">
            <h3>Summary by Just Prova</h3>
            <div id="art-summary"></div>
        </div>

        <a id="art-link" href="#" target="_blank" class="btn-original">Read Original Article</a>
    </div>

    <!-- Custom Toolbar UI -->
    <div id="custom-toolbar">
        <button id="btn-highlight">Highlight</button>
        <button id="btn-copy">Copy</button>
        <button id="btn-translate">Translate</button>
    </div>

    <!-- Translation Bottom Sheet -->
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-header">
            <span>✨ Just Prova Analysis</span>
            <button class="close-sheet" onclick="closeSheet()">✕</button>
        </div>
        <div id="sheet-content"></div>
    </div>

    <script>
        // Replace with your active worker link
        const WORKER_URL = "https://just-daily-proxy.siyamulhaquesiyam70.workers.dev"; 

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id');

            if (!articleId) return;

            try {
                const response = await fetch(`news.json`);
                const data = await response.json();
                const article = data.articles.find(a => a.id === articleId);

                if (article) {
                    document.getElementById('art-title').innerText = article.title;
                    document.getElementById('art-source').innerText = `${article.source} • ${article.category}`;
                    
                    // Added Date Injection
                    if (article.date) {
                        document.getElementById('art-date').innerText = article.date;
                    }
                    
                    // Injecting raw HTML preserving original <p> tags
                    document.getElementById('art-content').innerHTML = article.full_text;
                    document.getElementById('art-summary').innerText = article.summary;
                    document.getElementById('art-link').href = article.link;

                    if (article.image) {
                        const imgEl = document.getElementById('art-img');
                        imgEl.src = article.image;
                        imgEl.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error("Error loading article:", error);
            }
        }

        // Custom Toolbar & Block Native Context Menu
        const customToolbar = document.getElementById('custom-toolbar');
        const bottomSheet = document.getElementById('bottom-sheet');
        const sheetContent = document.getElementById('sheet-content');
        let selectedText = "";
        let selectionRange = null;

        // Block Native Context Menu (Right Click/Long Press)
        document.addEventListener('contextmenu', event => {
            event.preventDefault();
        });

        document.addEventListener('selectionchange', () => {
            const selection = window.getSelection();
            selectedText = selection.toString().trim();
            
            if (selectedText.length > 0 && selectedText.length < 1000) {
                selectionRange = selection.getRangeAt(0);
                const rect = selectionRange.getBoundingClientRect();
                
                customToolbar.style.top = `${window.scrollY + rect.top - 50}px`;
                customToolbar.style.left = `${rect.left + (rect.width / 2) - 100}px`;
                customToolbar.style.display = 'flex';
            } else {
                customToolbar.style.display = 'none';
            }
        });

        // Hide toolbar when clicking elsewhere
        document.addEventListener('mousedown', (e) => {
            if (!customToolbar.contains(e.target) && window.getSelection().toString().length === 0) {
                customToolbar.style.display = 'none';
            }
        });

        // Button Actions
        document.getElementById('btn-highlight').addEventListener('click', () => {
            if (selectionRange) {
                const span = document.createElement('span');
                span.className = 'highlighted-text';
                selectionRange.surroundContents(span);
                window.getSelection().removeAllRanges();
                customToolbar.style.display = 'none';
            }
        });

        document.getElementById('btn-copy').addEventListener('click', () => {
            if (selectedText) {
                navigator.clipboard.writeText(selectedText);
                window.getSelection().removeAllRanges();
                customToolbar.style.display = 'none';
            }
        });

        document.getElementById('btn-translate').addEventListener('click', async () => {
            if (!selectedText) return;

            customToolbar.style.display = 'none';
            bottomSheet.classList.add('active');
            sheetContent.innerHTML = '<span class="loader">Analyzing with Just Prova...</span>';

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: selectedText })
                });
                
                const data = await res.json();
                if(data.result) {
                    sheetContent.innerHTML = data.result;
                } else {
                    sheetContent.innerHTML = 'Translation failed.';
                }
            } catch (err) {
                sheetContent.innerHTML = 'Error communicating with server.';
            }
        });

        function closeSheet() {
            bottomSheet.classList.remove('active');
        }

        // Initialize
        loadArticle();
    </script>
</body>
</html>
