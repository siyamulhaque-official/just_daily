<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Just Daily — Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper-bg: #f4f1ea;
      --paper-card: #fcfaf5;
      --ink-dark: #2c2c2c;
      --ink-border: #d4cfc5;
      --ink-accent: #6b8699;
      --ink-tag: #e8dbce;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    a, a:visited, a:hover, a:active { color: inherit !important; text-decoration: none !important; }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--paper-bg);
      color: var(--ink-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px 30px 16px;
      display: flex;
      flex-direction: column;
    }

    .top-nav { margin-bottom: 20px; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-dark) !important;
      font-size: 14px;
      font-weight: 700;
      background: var(--paper-card);
      border: 1px solid var(--ink-border);
      padding: 6px 14px;
      border-radius: 6px;
    }

    .source-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      background: var(--ink-tag);
      color: #5c4a3d !important;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .headline {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink-dark);
      margin-bottom: 18px;
    }

    /* Color E-ink Image Filter (Slightly muted, warm colors) */
    .photo-frame {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      display: none;
      background: #e2dfd8;
    }
    .photo-frame img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
      filter: saturate(65%) contrast(110%) sepia(12%);
    }

    .reader-card {
      background: var(--paper-card);
      border: 1px solid var(--ink-border);
      border-radius: 8px;
      padding: 18px 16px;
      margin-bottom: 24px;
    }
    .summary-text {
      font-size: 15.5px;
      line-height: 1.8;
      color: var(--ink-dark);
    }
    .summary-text strong {
      display: block;
      color: var(--ink-dark);
      font-size: 16px;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--ink-border);
      padding-bottom: 4px;
    }
    .summary-text strong:first-child { margin-top: 0; }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      color: #fff !important;
      background: var(--ink-accent);
      border-radius: 6px;
    }

    .app-footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1px solid var(--ink-border);
      text-align: center;
      font-size: 13px;
      color: #7a756d;
    }
    .app-footer a { color: var(--ink-accent) !important; font-weight: 700; }
  </style>
</head>
<body>

  <main class="app-screen">
    <div>
      <nav class="top-nav">
        <a href="index.html" class="back-btn">← ফিরে যান</a>
      </nav>

      <article id="article-root">
        <div><span class="source-label" id="source-name">সংবাদ</span></div>
        <h1 class="headline" id="headline">শিরোনাম লোড হচ্ছে...</h1>

        <div class="photo-frame" id="photo-frame">
          <img id="article-img" src="" alt="News Image">
        </div>

        <div class="reader-card">
          <div class="summary-text" id="summary-text">বিশ্লেষণ প্রস্তুত হচ্ছে...</div>
        </div>

        <a id="source-link" href="#" target="_blank" rel="noopener noreferrer" class="action-btn">
          মূল সংবাদপত্রে পড়ুন ↗
        </a>
      </article>
    </div>

    <footer class="app-footer">
      Developed by <a href="https://siyamulhaque.com" target="_blank">Siyamul Haque</a>
    </footer>
  </main>

  <script>
    function renderMarkdown(txt) {
      if (!txt) return '';
      return txt.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    }

    function extractPureText(str) {
      if (!str) return '';
      const doc = new DOMParser().parseFromString(str, 'text/html');
      return doc.body.textContent || doc.body.innerText || '';
    }

    const params = new URLSearchParams(window.location.search);
    const articleId = parseInt(params.get('id'), 10);

    fetch('news.json?t=' + new Date().getTime(), { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        const item = data.articles[articleId];
        if (item) {
          document.getElementById('source-name').innerText = item.source;
          document.getElementById('headline').innerText = extractPureText(item.title);
          document.getElementById('summary-text').innerHTML = renderMarkdown(item.summary);
          document.getElementById('source-link').href = item.link;

          if (item.image) {
            const frame = document.getElementById('photo-frame');
            const img = document.getElementById('article-img');
            img.src = item.image;
            frame.style.display = 'block';
            img.onerror = () => { frame.style.display = 'none'; };
          }
        }
      });
  </script>
</body>
</html>
