<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport constraint added to prevent zoom/overflow bugs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Just Daily - Article</title>
    
    <!-- App Icon Setup -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #161618;
            --surface: #1c1c1f;
            --text-body: #a1a1aa;
            --text-heading: #e4e4e7;
            --border-color: #27272a;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-body);
            font-family: 'Inter', sans-serif;
            line-height: 1.8;
            overflow-x: hidden; /* Prevents screen edge clipping */
        }

        .app-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            color: var(--text-body);
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--text-heading);
        }

        .article-container {
            max-width: 800px;
            margin: 0 auto;
            /* Increased padding (26px) keeps text safely away from the exact screen edge */
            padding: 30px 26px; 
        }

        .article-meta {
            font-size: 0.85rem;
            color: var(--text-body);
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .article-title {
            font-family: 'Merriweather', serif;
            color: var(--text-heading);
            font-size: 2.2rem;
            margin: 0 0 25px 0;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .action-btn {
            background-color: var(--surface);
            color: var(--text-heading);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .action-btn:hover {
            background-color: #27272a;
        }

        .article-content {
            font-family: 'Merriweather', serif; /* Premium reading font */
            font-size: 1.15rem;
            color: #d4d4d8;
            line-height: 1.8;
            word-wrap: break-word;
        }

        .article-content p {
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .article-title { font-size: 1.8rem; }
            .article-container { padding: 25px 24px; }
            .article-content { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <a href="/" class="back-link">← Back to Feed</a>
        <!-- Authentication UI has been completely removed from here -->
    </header>

    <main class="article-container" id="article-view">
        <p>Loading article details...</p>
    </main>

    <script>
        async function loadArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            
            try {
                const response = await fetch(`news.json?t=${new Date().getTime()}`);
                const data = await response.json();
                const article = data.articles.find(a => a.id == articleId);
                
                if(article) {
                    document.getElementById('article-view').innerHTML = `
                        <div class="article-meta">
                            ${article.source} • ${article.category}
                        </div>
                        <h1 class="article-title">${article.title}</h1>
                        <div class="action-buttons">
                            <button class="action-btn">🔊 Listen to Article</button>
                            <button class="action-btn">🔖 Save Article</button>
                        </div>
                        <div class="article-content">
                            <!-- In a real app, article.content or full HTML goes here -->
                            <p>${article.content || "Full detailed article content goes here. If you have paragraphs in your JSON, map them accordingly."}</p>
                        </div>
                    `;
                } else {
                    document.getElementById('article-view').innerHTML = '<p>Article not found.</p>';
                }
            } catch (error) {
                console.error("Error fetching article:", error);
                document.getElementById('article-view').innerHTML = '<p>Error loading content.</p>';
            }
        }
        
        loadArticle();
    </script>
</body>
</html>
