<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Daily</title>
    
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #161618;
            --surface: #1c1c1f;
            --text-body: #a1a1aa;
            --text-heading: #e4e4e7;
            --border-color: #27272a;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-body);
            font-family: 'Inter', sans-serif; line-height: 1.7;
        }

        .app-header {
            display: flex; justify-content: space-between; align-items: center; padding: 25px 20px;
            border-bottom: 1px solid var(--border-color); background-color: var(--bg-dark);
            max-width: 900px; margin: 0 auto;
        }

        .header-left { display: flex; flex-direction: column; align-items: flex-start; }
        .brand-link { text-decoration: none; display: inline-block; }
        header h1 { font-family: 'Merriweather', serif; color: var(--text-heading); margin: 0; font-size: 2.2rem; letter-spacing: -0.5px; }
        .timestamp { font-size: 0.85rem; color: #71717a; margin-top: 5px; font-weight: 400; }
        
        .header-right { display: flex; align-items: center; }
        .menu-btn { background: none; border: none; color: var(--text-heading); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .menu-btn:hover { color: #fff; }

        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0, 0, 0, 0.6); z-index: 1999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .menu-overlay.active { opacity: 1; pointer-events: all; }
        
        .side-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100vh; background-color: var(--bg-dark); z-index: 2000; transition: left 0.3s ease; border-right: 1px solid var(--border-color); padding: 25px 20px; box-sizing: border-box; box-shadow: 4px 0 15px rgba(0,0,0,0.5); overflow-y: auto; }
        .side-menu.active { left: 0; }
        
        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; color: var(--text-heading); font-family: 'Merriweather', serif; font-size: 1.2rem; }
        .close-menu-btn { background: none; border: none; color: var(--text-body); font-size: 1.5rem; cursor: pointer; padding: 0; display: flex; }
        .close-menu-btn:hover { color: var(--text-heading); }

        #auth-container { display: flex; flex-direction: column; width: 100%; align-items: flex-start; }
        .premium-login-btn { display: flex; align-items: center; justify-content: center; width: 100%; gap: 8px; background-color: #e4e4e7; color: #161618; border: none; padding: 10px 18px; border-radius: 20px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .premium-login-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1); }
        
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; width: 100%; }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #27272a; object-fit: cover; }
        .user-name { color: var(--text-heading); font-weight: 600; font-size: 1.05rem; }

        /* Updated Modern Icons & Buttons */
        .btn-menu-item { background: none; border: none; color: var(--text-heading); cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.95rem; text-align: left; padding: 12px 0; width: 100%; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; transition: color 0.2s; }
        .btn-menu-item:hover { color: #fff; }
        
        .btn-logout { background: #3f3f46; color: var(--text-heading); border: none; padding: 12px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; width: 100%; margin-top: 25px; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-logout:hover { background: #52525b; }

        .saved-articles-container { display: none; max-height: 250px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--surface); width: 100%; }
        .saved-articles-container::-webkit-scrollbar { width: 6px; }
        .saved-articles-container::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .saved-article-item { display: block; padding: 12px; border-bottom: 1px solid var(--border-color); text-decoration: none; transition: background 0.2s; }
        .saved-article-item:last-child { border-bottom: none; }
        .saved-article-item:hover { background: #27272a; }
        .saved-article-title { color: var(--text-heading); font-size: 0.85rem; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .saved-article-date { color: #71717a; font-size: 0.75rem; margin-top: 4px; display: block; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; display: grid; gap: 30px; }
        .news-card { background-color: var(--surface); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease; text-decoration: none; display: block; overflow: hidden; }
        .news-card:hover { transform: translateY(-2px); border-color: #3f3f46; }
        .card-img { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; margin-bottom: 20px; filter: brightness(0.9); }
        .news-category { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #a1a1aa; margin-bottom: 12px; display: block; font-weight: 600; }
        .news-title { font-family: 'Merriweather', serif; color: var(--text-heading); font-size: 1.4rem; margin: 0 0 15px 0; line-height: 1.4; }
        .news-source { font-size: 0.85rem; color: #71717a; }

        @media (max-width: 600px) {
            .news-title { font-size: 1.2rem; }
            .card-img { height: 180px; }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="menuOverlay" class="menu-overlay"></div>
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <span>Menu</span>
            <button id="closeMenuBtn" class="close-menu-btn">✕</button>
        </div>
        <div id="auth-container"></div>
    </div>

    <header class="app-header">
        <div class="header-left">
            <a href="/" class="brand-link"><h1>Just Daily</h1></a>
            <div class="timestamp" id="last-updated">Fetching updates...</div>
        </div>
        <div class="header-right">
            <button id="menuBtn" class="menu-btn" aria-label="Open Menu">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="15" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <div class="container" id="news-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVvKKMF56vXQpqExWfeFq7xvFLDIcNxc8",
            authDomain: "just-daily.firebaseapp.com",
            projectId: "just-daily",
            storageBucket: "just-daily.firebasestorage.app",
            messagingSenderId: "634875817986",
            appId: "1:634875817986:web:224f4af4e021e3c5f5b71b",
            measurementId: "G-6SV0953YZN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        let currentUser = null;
        const authContainer = document.getElementById('auth-container');
        const newsContainer = document.getElementById('news-container');

        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const closeMenuBtn = document.getElementById('closeMenuBtn');

        function toggleMenu() {
            sideMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu);

        async function fetchSavedArticles() {
            const container = document.getElementById('saved-articles-container');
            container.innerHTML = '<div style="padding:20px 15px; color:#a1a1aa; font-size:0.85rem; text-align:center;">Loading articles...</div>';
            
            try {
                const q = collection(db, "users", currentUser.uid, "saved_articles");
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<div style="padding:20px 15px; color:#71717a; font-size:0.85rem; text-align:center;">No saved articles yet.</div>';
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const dateStr = data.date ? new Date(data.date).toLocaleDateString() : '';
                    html += `
                        <a href="article.html?id=${data.id}" class="saved-article-item">
                            <span class="saved-article-title">${data.title}</span>
                            ${dateStr ? `<span class="saved-article-date">Saved on: ${dateStr}</span>` : ''}
                        </a>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error("Firestore Loading Error:", error);
                container.innerHTML = `<div style="padding:20px 15px; color:#ef4444; font-size:0.85rem; text-align:center;">Error loading. Check Firebase Rules.</div>`;
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authContainer.innerHTML = `
                    <div class="user-info">
                        <img src="${user.photoURL}" alt="Profile" class="user-avatar" referrerpolicy="no-referrer">
                        <span class="user-name">${user.displayName || 'User'}</span>
                    </div>
                    
                    <button id="btn-saved-toggle" class="btn-menu-item">
                        <span style="display:flex; align-items:center; gap:10px;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                            Saved Articles
                        </span>
                        <span style="font-size: 0.8rem;">▼</span>
                    </button>
                    <div id="saved-articles-container" class="saved-articles-container"></div>
                    
                    <button id="btn-logout" class="btn-logout">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Sign Out
                    </button>
                `;
                
                document.getElementById('btn-saved-toggle').addEventListener('click', () => {
                    const container = document.getElementById('saved-articles-container');
                    if (container.style.display === 'block') {
                        container.style.display = 'none';
                    } else {
                        container.style.display = 'block';
                        fetchSavedArticles();
                    }
                });

                document.getElementById('btn-logout').addEventListener('click', () => {
                    const confirmLogout = confirm("Are you sure you want to sign out?");
                    if(confirmLogout) { signOut(auth); toggleMenu(); }
                });
            } else {
                authContainer.innerHTML = `
                    <button class="premium-login-btn" id="loginBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                        Sign In
                    </button>
                `;
                
                document.getElementById('loginBtn').addEventListener('click', () => {
                    signInWithPopup(auth, provider).then(() => { toggleMenu(); });
                });
            }
        });

        async function fetchNews() {
            try {
                const response = await fetch(`news.json?t=${new Date().getTime()}`);
                const data = await response.json();
                
                document.getElementById('last-updated').innerText = data.last_updated;
                
                let html = '';
                data.articles.forEach(article => {
                    const imgHtml = article.image ? `<img src="${article.image}" class="card-img" alt="Banner">` : '';
                    html += `
                        <a href="article.html?id=${article.id}" class="news-card">
                            ${imgHtml}
                            <span class="news-category">${article.category}</span>
                            <h2 class="news-title">${article.title}</h2>
                            <span class="news-source">${article.source}</span>
                        </a>
                    `;
                });
                newsContainer.innerHTML = html;
            } catch (error) {
                newsContainer.innerHTML = '<p>Failed to load news. Please try again later.</p>';
            }
        }

        fetchNews();
    </script>
</body>
</html>
