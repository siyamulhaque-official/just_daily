<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Daily</title>
    
    <!-- অ্যাপ আইকন ও ফ্যাভিকন (logo.jpg) -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #161618;
            --surface: #1c1c1f;
            --text-body: #a1a1aa;
            --text-heading: #e4e4e7;
            --border-color: #27272a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-body);
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            max-width: 900px;
            margin: 0 auto;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand-link {
            text-decoration: none;
            display: inline-block;
        }

        header h1 {
            font-family: 'Merriweather', serif;
            color: var(--text-heading);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }

        .timestamp {
            font-size: 0.85rem;
            color: #71717a;
            margin-top: 5px;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        /* Unique Menu Button Styles */
        .menu-btn {
            background: none;
            border: none;
            color: var(--text-heading);
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .menu-btn:hover {
            color: #fff;
        }

        /* Side Menu Styles */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .menu-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background-color: var(--bg-dark);
            z-index: 2000;
            transition: left 0.3s ease;
            border-right: 1px solid var(--border-color);
            padding: 25px 20px;
            box-sizing: border-box;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }

        .side-menu.active {
            left: 0;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            color: var(--text-heading);
            font-family: 'Merriweather', serif;
            font-size: 1.2rem;
        }

        .close-menu-btn {
            background: none;
            border: none;
            color: var(--text-body);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        .close-menu-btn:hover {
            color: var(--text-heading);
        }

        #auth-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: flex-start;
        }

        .premium-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 8px;
            background-color: #e4e4e7;
            color: #161618;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .premium-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s ease;
            color: var(--text-heading);
            font-weight: 600;
        }

        .user-profile:hover {
            transform: scale(1.02);
            color: #fff;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #27272a;
            object-fit: cover;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            gap: 30px;
        }

        .news-card {
            background-color: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            display: block;
            overflow: hidden;
        }

        .news-card:hover {
            transform: translateY(-2px);
            border-color: #3f3f46;
        }
        
        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 20px;
            filter: brightness(0.9);
        }

        .news-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a1a1aa;
            margin-bottom: 12px;
            display: block;
            font-weight: 600;
        }

        .news-title {
            font-family: 'Merriweather', serif;
            color: var(--text-heading);
            font-size: 1.4rem;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .news-source {
            font-size: 0.85rem;
            color: #71717a;
        }

        @media (max-width: 600px) {
            .news-title { font-size: 1.2rem; }
            .card-img { height: 180px; }
            header h1 { font-size: 1.8rem; }
            .premium-login-btn { padding: 8px 14px; font-size: 0.85rem; }
            .user-avatar { width: 35px; height: 35px; }
        }
    </style>
</head>
<body>

    <!-- Menu Overlay & Side Menu Window -->
    <div id="menuOverlay" class="menu-overlay"></div>
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <span>Menu</span>
            <button id="closeMenuBtn" class="close-menu-btn">✕</button>
        </div>
        <div id="auth-container">
            <!-- JS dynamically loads either Sign In or Profile picture here -->
        </div>
    </div>

    <header class="app-header">
        <div class="header-left">
            <a href="/" class="brand-link">
                <h1>Just Daily</h1>
            </a>
            <div class="timestamp" id="last-updated">Fetching updates...</div>
        </div>
        
        <div class="header-right">
            <!-- Unique Menu Button (Staggered Lines) -->
            <button id="menuBtn" class="menu-btn" aria-label="Open Menu">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="15" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <div class="container" id="news-container">
        <!-- News cards will be injected here via JS -->
    </div>

    <!-- Integrated Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVvKKMF56vXQpqExWfeFq7xvFLDIcNxc8",
            authDomain: "just-daily.firebaseapp.com",
            projectId: "just-daily",
            storageBucket: "just-daily.firebasestorage.app",
            messagingSenderId: "634875817986",
            appId: "1:634875817986:web:224f4af4e021e3c5f5b71b",
            measurementId: "G-6SV0953YZN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const authContainer = document.getElementById('auth-container');
        const newsContainer = document.getElementById('news-container');

        // Menu Toggle Logic
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const closeMenuBtn = document.getElementById('closeMenuBtn');

        function toggleMenu() {
            sideMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu);

        // Dynamic Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.innerHTML = `
                    <div class="user-profile" id="userProfile" title="Click to Sign Out">
                        <img src="${user.photoURL}" alt="Profile" class="user-avatar" referrerpolicy="no-referrer">
                        <span>Sign Out</span>
                    </div>
                `;
                
                document.getElementById('userProfile').addEventListener('click', () => {
                    const confirmLogout = confirm("Are you sure you want to sign out?");
                    if(confirmLogout) {
                        signOut(auth);
                        toggleMenu(); // Close menu after action
                    }
                });
            } else {
                authContainer.innerHTML = `
                    <button class="premium-login-btn" id="loginBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                        Sign In
                    </button>
                `;
                
                document.getElementById('loginBtn').addEventListener('click', () => {
                    signInWithPopup(auth, provider).then(() => {
                        toggleMenu(); // Close menu after login
                    }).catch(error => {
                        console.error("Login Failed:", error);
                    });
                });
            }
        });

        // Function to Fetch News
        async function fetchNews() {
            try {
                const response = await fetch(`news.json?t=${new Date().getTime()}`);
                const data = await response.json();
                
                document.getElementById('last-updated').innerText = data.last_updated;
                
                newsContainer.innerHTML = '';

                data.articles.forEach(article => {
                    const card = document.createElement('a');
                    card.href = `article.html?id=${article.id}`;
                    card.className = 'news-card';
                    
                    const imgHtml = article.image ? `<img src="${article.image}" class="card-img" alt="Banner">` : '';
                    
                    card.innerHTML = `
                        ${imgHtml}
                        <span class="news-category">${article.category}</span>
                        <h2 class="news-title">${article.title}</h2>
                        <span class="news-source">${article.source}</span>
                    `;
                    newsContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading news:", error);
                newsContainer.innerHTML = '<p>Failed to load news. Please try again later.</p>';
            }
        }

        fetchNews();
    </script>
</body>
</html>
