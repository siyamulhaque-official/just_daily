<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Daily - Premium News</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #161618;
            --surface: #1c1c1f;
            --text-body: #a1a1aa;
            --text-heading: #e4e4e7;
            --border-color: #27272a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-body);
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
        }

        header {
            padding: 25px 20px;
            text-align: left; /* Updated: Left aligned */
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            max-width: 900px;
            margin: 0 auto;
        }

        header h1 {
            font-family: 'Merriweather', serif;
            color: var(--text-heading);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }

        .timestamp {
            font-size: 0.85rem;
            color: #71717a;
            margin-top: 5px;
            font-weight: 400;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            gap: 30px;
        }

        .news-card {
            background-color: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            display: block;
            overflow: hidden;
        }

        .news-card:hover {
            transform: translateY(-2px);
            border-color: #3f3f46;
        }
        
        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 20px;
            filter: brightness(0.9);
        }

        .news-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a1a1aa;
            margin-bottom: 12px;
            display: block;
            font-weight: 600;
        }

        .news-title {
            font-family: 'Merriweather', serif;
            color: var(--text-heading);
            font-size: 1.4rem;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .news-source {
            font-size: 0.85rem;
            color: #71717a;
        }

        @media (max-width: 600px) {
            .news-title { font-size: 1.2rem; }
            .card-img { height: 180px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Just Daily</h1>
        <div class="timestamp" id="last-updated">Fetching updates...</div>
    </header>

    <div class="container" id="news-container">
        <!-- News cards will be injected here via JS -->
    </div>

    <script>
        async function fetchNews() {
            try {
                const response = await fetch(`news.json?t=${new Date().getTime()}`);
                const data = await response.json();
                
                // Show ONLY the timestamp (Undefined fix)
                document.getElementById('last-updated').innerText = data.last_updated;
                
                const container = document.getElementById('news-container');
                container.innerHTML = '';

                data.articles.forEach(article => {
                    const card = document.createElement('a');
                    card.href = `article.html?id=${article.id}`;
                    card.className = 'news-card';
                    
                    // Inject image if exists
                    const imgHtml = article.image ? `<img src="${article.image}" class="card-img" alt="Banner">` : '';
                    
                    card.innerHTML = `
                        ${imgHtml}
                        <span class="news-category">${article.category}</span>
                        <h2 class="news-title">${article.title}</h2>
                        <span class="news-source">${article.source}</span>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading news:", error);
                document.getElementById('news-container').innerHTML = '<p>Failed to load news. Please try again later.</p>';
            }
        }

        fetchNews();
    </script>
</body>
</html>
