<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Just Daily - Color E-Ink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Kaleido 3 Color E-Ink Palette */
      --paper-bg: #f4f1ea;        /* Warm newsprint background */
      --paper-card: #fcfaf5;      /* Slightly brighter card */
      --ink-dark: #2c2c2c;        /* Pigment black */
      --ink-border: #d4cfc5;      /* Soft page border */
      --ink-accent: #6b8699;      /* Muted E-ink blue */
      --ink-tag: #e8dbce;         /* Muted E-ink orange/sand */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    a, a:visited, a:hover, a:active { color: inherit !important; text-decoration: none !important; }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--paper-bg);
      color: var(--ink-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      padding: 22px 16px 30px 16px;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      border-bottom: 2px solid var(--ink-border);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .brand {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--ink-dark);
      letter-spacing: -0.5px;
    }
    .status-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #7a756d;
      margin-top: 6px;
      font-weight: 600;
    }

    .news-feed { display: flex; flex-direction: column; gap: 14px; flex: 1; }

    .news-card {
      background: var(--paper-card);
      border: 1px solid var(--ink-border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      cursor: pointer;
    }
    .news-card:active { background: #f2efe9; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .source-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--ink-tag);
      color: #5c4a3d;
    }
    .index-indicator { font-size: 12px; font-weight: 700; color: #9a9488; }

    .news-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink-dark) !important;
    }

    .app-footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1px solid var(--ink-border);
      text-align: center;
      font-size: 13px;
      color: #7a756d;
    }
    .app-footer a { color: var(--ink-accent) !important; font-weight: 700; }
  </style>
</head>
<body>

  <main class="app-screen">
    <header class="app-header">
      <h1 class="brand">Just Daily</h1>
      <div class="status-meta">
        <span id="sync-time">আপডেট লোড হচ্ছে...</span>
        <span>COLOR E-INK</span>
      </div>
    </header>

    <section class="news-feed" id="news-feed"></section>

    <footer class="app-footer">
      Developed by <a href="https://siyamulhaque.com" target="_blank">Siyamul Haque</a>
    </footer>
  </main>

  <script>
    const bnDigits = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
    function toBn(num) { return num.toString().replace(/\d/g, d => bnDigits[d]); }

    function extractPureText(str) {
      if (!str) return '';
      const doc = new DOMParser().parseFromString(str, 'text/html');
      return doc.body.textContent || doc.body.innerText || '';
    }

    function formatTime(str) {
      if (!str) return '';
      const p = str.split(' ');
      if (p.length >= 3) {
        const d = p[0].split('-');
        if (d.length === 3) return `${d[2]}-${d[1]}-${d[0]} (${p[1]} ${p[2]})`;
      }
      return str;
    }

    fetch('news.json?t=' + new Date().getTime(), { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        document.getElementById('sync-time').innerText = `তারিখ: ${formatTime(data.last_updated)}`;
        const feed = document.getElementById('news-feed');
        feed.innerHTML = '';

        data.articles.forEach((item, index) => {
          const card = document.createElement('a');
          card.className = 'news-card';
          card.href = `article.html?id=${index}`;
          card.innerHTML = `
            <div class="card-top">
              <span class="source-tag">${item.source}</span>
              <span class="index-indicator">#${toBn(index + 1)} →</span>
            </div>
            <h2 class="news-title">${extractPureText(item.title)}</h2>
          `;
          feed.appendChild(card);
        });
      });
  </script>
</body>
</html>
