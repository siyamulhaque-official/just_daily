<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Just Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --surface: #0f1523;
      --border: #1a2337;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.12);
      --text-title: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg);
      color: var(--text-title);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 20px 16px 40px 16px;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7, 9, 14, 0.88);
      backdrop-filter: blur(14px);
      padding: 12px 0 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .brand span { color: var(--accent); }
    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }
    .sync-time {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .news-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
      text-decoration: none;
      display: block;
      transition: all 0.2s ease;
    }
    .news-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
      background: #141c30;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .source-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .arrow-indicator {
      margin-left: auto;
      font-size: 14px;
      color: var(--text-muted);
    }

    .news-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-title);
    }
  </style>
</head>
<body>

  <main class="app-screen">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">Just <span>Daily</span></div>
        <div class="live-tag">
          <div class="pulse-dot"></div>
          <span>LIVE BRIEF</span>
        </div>
      </div>
      <p class="sync-time" id="sync-time">সর্বশেষ সংবাদ লোড করা হচ্ছে...</p>
    </header>

    <section class="news-list" id="news-list"></section>
  </main>

  <script>
    const bengaliDigits = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
    function toBengali(str) {
      return str.toString().replace(/\d/g, d => bengaliDigits[d]);
    }

    // টাইম ফরম্যাট: date-month-year(time )
    function formatAppTime(rawStr) {
      if (!rawStr) return '';
      const parts = rawStr.split(' ');
      if (parts.length >= 3) {
        const dateParts = parts[0].split('-');
        if (dateParts.length === 3) {
          const formattedDate = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`;
          const formattedTime = `${parts[1]} ${parts[2]}`;
          return `${formattedDate}(${formattedTime} )`;
        }
      }
      return rawStr;
    }

    fetch('news.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('sync-time').innerText = `সর্বশেষ আপডেট: ${formatAppTime(data.last_updated)}`;
        const list = document.getElementById('news-list');
        list.innerHTML = '';

        data.articles.forEach((item, index) => {
          const card = document.createElement('a');
          card.className = 'news-card';
          // আলাদা আর্টিকেলে যাওয়ার লিংক
          card.href = `article.html?id=${index}`;

          card.innerHTML = `
            <div class="card-meta">
              <span class="source-tag">${item.source} • #${toBengali(index + 1)}</span>
              <span class="arrow-indicator">→</span>
            </div>
            <h2 class="news-title">${item.title}</h2>
          `;
          list.appendChild(card);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('sync-time').innerText = "খবর লোড করা সম্ভব হয়নি।";
      });
  </script>

</body>
</html>
