<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Just Daily - E-Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Pure Monochrome E-Ink Palette */
      --paper-bg: #ece9e2;       /* ম্যাট অফ-হোয়াইট (কাগজের মতো) */
      --paper-card: #f9f8f5;     /* কার্ডের একটু উজ্জ্বল অফ-হোয়াইট */
      --ink-black: #0a0a0a;      /* একদম গাঢ় কালো কালি */
      --ink-subtle: #4a4a4a;     /* হালকা গ্রে কালি */
      --ink-border: #1a1a1a;     /* ধারালো বর্ডার */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    a, a:visited, a:hover, a:active { color: inherit !important; text-decoration: none !important; }

    body {
      font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--paper-bg);
      color: var(--ink-black);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      padding: 22px 16px 30px 16px;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      border-bottom: 2px solid var(--ink-border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .brand {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--ink-black);
      letter-spacing: -0.5px;
    }
    .status-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-subtle);
      margin-top: 6px;
      font-weight: 600;
      border-top: 1px dashed #c0bcba;
      padding-top: 6px;
    }

    .news-feed { display: flex; flex-direction: column; gap: 14px; flex: 1; }

    .news-card {
      background: var(--paper-card);
      border: 1.5px solid var(--ink-border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 2px 2px 0px var(--ink-border);
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    .news-card:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--ink-border);
      background: #e4e1d9;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    /* Category Tag - Pure Monochrome */
    .category-tag {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid var(--ink-border);
      background: var(--paper-bg);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .source-name { font-size: 12px; font-weight: 700; color: var(--ink-subtle); }

    .news-title {
      font-size: 17.5px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink-black) !important;
    }

    .app-footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1.5px solid var(--ink-border);
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-subtle);
    }
    .app-footer a { color: var(--ink-black) !important; font-weight: 700; text-decoration: underline !important; }
  </style>
</head>
<body>

  <main class="app-screen">
    <header class="app-header">
      <h1 class="brand">Just Daily</h1>
      <div class="status-meta">
        <span id="sync-time">আপডেট লোড হচ্ছে...</span>
        <span>E-PAPER EDITION</span>
      </div>
    </header>

    <section class="news-feed" id="news-feed"></section>

    <footer class="app-footer">
      Developed by <a href="https://siyamulhaque.com" target="_blank">Siyamul Haque</a>
    </footer>
  </main>

  <script>
    function extractPureText(str) {
      if (!str) return '';
      const doc = new DOMParser().parseFromString(str, 'text/html');
      return doc.body.textContent || doc.body.innerText || '';
    }

    function formatTime(str) {
      if (!str) return '';
      const p = str.split(' ');
      if (p.length >= 3) {
        const d = p[0].split('-');
        if (d.length === 3) return `${d[2]}-${d[1]}-${d[0]} (${p[1]} ${p[2]})`;
      }
      return str;
    }

    fetch('news.json?t=' + new Date().getTime(), { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        document.getElementById('sync-time').innerText = `তারিখ: ${formatTime(data.last_updated)}`;
        const feed = document.getElementById('news-feed');
        feed.innerHTML = '';

        if (!data.articles || data.articles.length === 0) {
           feed.innerHTML = '<p style="text-align:center;">No articles found.</p>';
           return;
        }

        data.articles.forEach((item, index) => {
          const card = document.createElement('a');
          card.className = 'news-card';
          card.href = `article.html?id=${index}`;
          card.innerHTML = `
            <div class="card-top">
              <span class="category-tag">${item.category || "News"}</span>
              <span class="source-name">${item.source}</span>
            </div>
            <h2 class="news-title">${extractPureText(item.title)}</h2>
          `;
          feed.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('sync-time').innerText = "ডেটা লোড করতে সমস্যা হয়েছে।";
        console.error(err);
      });
  </script>
</body>
</html>
