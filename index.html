<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Just Daily — E-Paper Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Hind+Siliguri:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f4ee;       /* কিন্ডলের ক্লাসিক ম্যাট পেপার ব্যাকগ্রাউন্ড */
      --paper-card: #ffffff;  /* কার্ডের পিওর পেপার কালার */
      --ink: #111111;        /* গাঢ় ব্ল্যাক ইঙ্ক */
      --ink-muted: #555555;  /* হালকা কালি */
      --ink-border: #222222; /* ক্রিস্প ই-ইঙ্ক বর্ডার */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Hind Siliguri', 'Newsreader', serif;
      background-color: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 24px 18px 30px 18px;
      display: flex;
      flex-direction: column;
    }

    /* E-Ink Newspaper Header */
    .app-header {
      border-bottom: 2px solid var(--ink-border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--ink);
      text-transform: uppercase;
    }
    .eink-pill {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 11px;
      font-weight: 700;
      border: 1.5px solid var(--ink);
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--ink);
      color: var(--paper);
      letter-spacing: 0.5px;
    }
    .sync-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--ink-muted);
      margin-top: 8px;
      font-weight: 500;
      border-top: 1px solid #dedede;
      padding-top: 6px;
    }

    /* News Feed Stream */
    .news-feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    /* Tactile Paper Card */
    .news-card {
      background: var(--paper-card);
      border: 1.5px solid var(--ink-border);
      border-radius: 8px;
      padding: 16px 14px;
      text-decoration: none;
      color: inherit;
      display: block;
      box-shadow: 2px 2px 0px var(--ink-border); /* ক্লাসিক ফ্ল্যাট ই-ইঙ্ক ড্রপ শ্যাডো */
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .news-card:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--ink-border);
      background: #f0eee6;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .source-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid var(--ink-border);
      padding: 1px 6px;
      border-radius: 3px;
      color: var(--ink);
      background: var(--paper);
    }
    .index-num {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
    }

    .news-title {
      font-size: 17.5px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--ink);
    }

    /* Footer */
    .app-footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1.5px solid var(--ink-border);
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-muted);
    }
    .app-footer a {
      color: var(--ink);
      text-decoration: underline;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <main class="app-screen">
    <header class="app-header">
      <div class="header-top">
        <h1 class="brand">Just Daily</h1>
        <span class="eink-pill">E-PAPER</span>
      </div>
      <div class="sync-meta">
        <span id="sync-time">আপডেট লোড হচ্ছে...</span>
        <span>TWICE DAILY</span>
      </div>
    </header>

    <section class="news-feed" id="news-feed"></section>

    <footer class="app-footer">
      Developed by <a href="https://siyamulhaque.com" target="_blank" rel="noopener noreferrer">Siyamul Haque</a>
    </footer>
  </main>

  <script>
    const bengaliDigits = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
    function toBengali(str) {
      return str.toString().replace(/\d/g, d => bengaliDigits[d]);
    }

    // টাইম ফরম্যাট: DD-MM-YYYY (HH:MM AM/PM)
    function formatAppTime(rawStr) {
      if (!rawStr) return '';
      const parts = rawStr.split(' ');
      if (parts.length >= 3) {
        const dateParts = parts[0].split('-');
        if (dateParts.length === 3) {
          return `${dateParts[2]}-${dateParts[1]}-${dateParts[0]} (${parts[1]} ${parts[2]})`;
        }
      }
      return rawStr;
    }

    fetch('news.json?t=' + new Date().getTime(), { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        document.getElementById('sync-time').innerText = `তারিখ: ${formatAppTime(data.last_updated)}`;
        const container = document.getElementById('news-feed');
        container.innerHTML = '';

        data.articles.forEach((item, index) => {
          const card = document.createElement('a');
          card.className = 'news-card';
          card.href = `article.html?id=${index}`;

          card.innerHTML = `
            <div class="card-meta">
              <span class="source-tag">${item.source}</span>
              <span class="index-num">#${toBengali(index + 1)} →</span>
            </div>
            <h2 class="news-title">${item.title}</h2>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('sync-time').innerText = "তথ্য লোড করা যায়নি।";
      });
  </script>

</body>
</html>
