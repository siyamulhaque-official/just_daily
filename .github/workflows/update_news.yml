/**
 * Just Daily — Cloudflare Worker
 * ===============================
 * Secure proxy between the article.html frontend and the DeepSeek API.
 * Keeps DEEPSEEK_API_KEY off the client entirely.
 *
 * Setup:
 *   1. wrangler secret put DEEPSEEK_API_KEY
 *   2. (optional) set ALLOWED_ORIGIN in wrangler.toml [vars] to lock CORS
 *      to your deployed frontend's origin instead of "*".
 *   3. wrangler deploy
 *   4. Point WORKER_URL in article.html at this Worker's URL.
 */

const DEEPSEEK_API_URL = "https://api.deepseek.com/v1/chat/completions";
// NOTE: confirm this matches the exact model name active on your DeepSeek
// account/dashboard before relying on it in production.
const DEEPSEEK_MODEL = "deepseek-flash";

const MAX_INPUT_LENGTH = 1000;

function corsHeaders(origin) {
  return {
    "Access-Control-Allow-Origin": origin || "*",
    "Access-Control-Allow-Methods": "POST, OPTIONS",
    "Access-Control-Allow-Headers": "Content-Type",
    "Access-Control-Max-Age": "86400",
  };
}

function jsonResponse(body, status, origin) {
  return new Response(JSON.stringify(body), {
    status,
    headers: {
      "Content-Type": "application/json",
      ...corsHeaders(origin),
    },
  });
}

/** Builds the DeepSeek prompt based on how much text was selected. */
function buildPrompt(text) {
  const wordCount = text.trim().split(/\s+/).filter(Boolean).length;

  if (wordCount <= 2) {
    return (
      "You are a bilingual English-Bengali dictionary assistant. For the " +
      `English word or short phrase "${text}", respond ONLY with raw HTML ` +
      "(no Markdown, no code fences) using <br> for line breaks and " +
      "<strong> for labels, in exactly this structure:\n" +
      "<strong>Bengali meaning:</strong> ...<br>" +
      "<strong>Part of speech:</strong> ...<br>" +
      "<strong>Synonyms:</strong> word1, word2<br>" +
      "<strong>Antonyms:</strong> word1, word2"
    );
  }

  if (wordCount <= 5) {
    return (
      "You are a bilingual English-Bengali language assistant. For the " +
      `English phrase "${text}", respond ONLY with raw HTML (no Markdown, ` +
      "no code fences) using <br> for line breaks and <strong> for labels, " +
      "in exactly this structure:\n" +
      "<strong>Bengali meaning:</strong> ...<br>" +
      "<strong>Grammar context:</strong> a brief note on how this phrase " +
      "functions grammatically in a sentence"
    );
  }

  return (
    "You are a professional English-to-Bengali translator. Translate the " +
    `following English sentence into natural, fluent Bengali: "${text}". ` +
    "Respond ONLY with raw HTML (no Markdown, no code fences) in exactly " +
    "this structure:\n" +
    "<strong>Bengali translation:</strong> ..."
  );
}

async function handleTranslate(request, env, origin) {
  let body;
  try {
    body = await request.json();
  } catch {
    return jsonResponse({ error: "Invalid JSON body" }, 400, origin);
  }

  const text = (body && body.text ? String(body.text) : "").trim();
  if (!text) {
    return jsonResponse({ error: "Missing 'text' field" }, 400, origin);
  }
  if (text.length > MAX_INPUT_LENGTH) {
    return jsonResponse({ error: "Selected text is too long" }, 413, origin);
  }

  const deepseekResp = await fetch(DEEPSEEK_API_URL, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${env.DEEPSEEK_API_KEY}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      model: DEEPSEEK_MODEL,
      messages: [
        {
          role: "system",
          content: "You are a precise, concise bilingual assistant. Follow the requested HTML formatting exactly and never wrap output in Markdown code fences.",
        },
        { role: "user", content: buildPrompt(text) },
      ],
      temperature: 0.3,
      max_tokens: 300,
    }),
  });

  if (!deepseekResp.ok) {
    const detail = await deepseekResp.text();
    return jsonResponse({ error: "DeepSeek API error", detail }, 502, origin);
  }

  const data = await deepseekResp.json();
  const html = data?.choices?.[0]?.message?.content?.trim() || "";

  return jsonResponse({ result: html }, 200, origin);
}

export default {
  async fetch(request, env) {
    const origin = env.ALLOWED_ORIGIN || "*";

    if (request.method === "OPTIONS") {
      return new Response(null, { headers: corsHeaders(origin) });
    }

    if (request.method !== "POST") {
      return jsonResponse({ error: "Method not allowed" }, 405, origin);
    }

    try {
      return await handleTranslate(request, env, origin);
    } catch (err) {
      return jsonResponse({ error: "Internal error", detail: String(err) }, 500, origin);
    }
  },
};
