name: Update Just Daily News

on:
  schedule:
    # 08:00 and 17:00 Bangladesh Standard Time (UTC+6) => 02:00 / 11:00 UTC
    - cron: "0 2,11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests

      - name: Run AI summarizer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python ai_summarizer.py

      - name: Commit and push updated news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes to news.json — skipping commit."
          else
            git commit -m "chore: update news.json [automated]"
            git push
          fi