name: Auto Update News Twice Daily

on:
  schedule:
    # 02:00 UTC = বাংলাদেশ সময় সকাল 8:00 AM
    # 11:00 UTC = বাংলাদেশ সময় বিকাল 5:00 PM
    - cron: '0 2,11 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install feedparser beautifulsoup4 requests

      - name: Run News Summarizer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python ai_summarizer.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Auto update daily news with full text [skip ci]" || exit 0
          git push
